<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Office Birds v2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;font-family:system-ui,Segoe UI,Arial;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:10;left:14px;top:14px;display:flex;gap:10px;pointer-events:none}.p{pointer-events:auto;background:#07101dcc;border:1px solid #ffffff22;border-radius:15px;padding:12px 15px;backdrop-filter:blur(8px);font-size:clamp(13px,.82vw,17px);box-shadow:0 12px 40px #0005}.t{font-weight:900;font-size:clamp(16px,1vw,21px)}.s{opacity:.78;margin-top:3px}.st{display:grid;grid-template-columns:auto auto;gap:5px 18px;margin-top:9px}.st b{text-align:right}button{border:1px solid #ffffff2a;background:#ffffff16;color:#fff;border-radius:11px;padding:11px 15px;font-weight:850;font-size:14px;cursor:pointer}.super{display:none;position:fixed;z-index:20;left:50%;bottom:20px;transform:translateX(-50%)}.super.show{display:block}.super button{font-size:22px;padding:16px 30px;border:2px solid #ffd652aa;background:#ffbf2638}.toast{position:fixed;z-index:30;left:50%;top:16%;transform:translateX(-50%);background:#000a;border-radius:999px;padding:9px 16px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:760px){.hud{left:7px;top:7px;right:7px;flex-direction:column}.p{max-width:calc(100vw - 14px);padding:9px 11px}.s{display:none}}</style></head><body><div class="hud"><div class="p"><div class="t">Office Birds — Local Destruction v2</div><div class="s">Каждая секция активируется отдельно • меньше застреваний • спокойнее цепная реакция</div><div class="st"><span>Счёт</span><b id="score">0</b><span>Цели</span><b id="targets">0</b><span>Разрушено</span><b id="broken">0</b><span>Выстрелы</span><b id="shots">0</b></div></div><div class="p"><button id="reset">Reset</button> <button id="debug">Debug</button> <button id="minus">−</button> <button id="plus">+</button></div></div><div id="super" class="super"><button>SUPER ⚡</button></div><div id="toast" class="toast"></div><canvas id="c"></canvas><script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script><script>(()=>{'use strict';const{Engine,Render,Runner,World,Bodies,Body,Events,Composite,Vector}=Matter,$=x=>document.getElementById(x),c=$('c');const A={bg:'assets/bg_office.png',ground:'assets/ground/ground.png',beam:'assets/office/beam.png',pillar:'assets/office/pillar.png',manager:'assets/office/manager.png',idle:'assets/player/human_idle.png',fly:'assets/player/human_fly.png'};const S={drag:false,launched:false,can:true,super:false,score:0,shots:0,broken:0,zoom:1,pid:null,bounds:null};const E=Engine.create({enableSleeping:true});E.world.gravity.y=1;E.positionIterations=10;E.velocityIterations=8;const R=Render.create({canvas:c,engine:E,options:{width:innerWidth,height:innerHeight,pixelRatio:Math.min(devicePixelRatio||1,2),wireframes:false,background:'#07101d',hasBounds:true}}),run=Runner.create({isFixed:true,delta:1000/60});let floor,hero,anchor,parts=[],targets=[],debris=[],active=new Set(),cam={x:850,y:400,tx:850,ty:400,shake:0};const cfg={floor:92,r:36,pull:330,power:.145,maxV:38,minHit:3.3,dmg:.095,respawn:7000};function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1100)}function spr(tex,x,y){return{sprite:{texture:tex,xScale:x,yScale:y}}}function box(x,y,w,h,o={}){let b=Bodies.rectangle(x,y,w,h,{isStatic:true,restitution:.02,friction:o.f??.75,frictionStatic:o.fs??.85,frictionAir:.012,density:o.d??.002,chamfer:{radius:4},render:o.render||{fillStyle:'#9a6a42'}});b.g={kind:o.kind||'beam',hp:o.hp||3,w,h,section:o.section??-1,dead:false,born:performance.now()};return b}function build(){parts=[];targets=[];debris=[];active.clear();let base=innerHeight-cfg.floor,first=Math.max(980,innerWidth*.68),houses=[{x:first,n:3},{x:first+570,n:3},{x:first+1140,n:4}];houses.forEach((H,sec)=>{let W=390,tier=126,l=H.x-W/2,r=H.x+W/2,bs=440/880,ps=330/660,ms=86/172;for(let n=0;n<H.n;n++){let y=base-35-n*tier,b=box(H.x,y,W,32,{kind:'beam',hp:3.5,section:sec,d:.0024,render:spr(A.beam,W/880,32/64)});parts.push(b);if(n<H.n-1){parts.push(box(l,y-tier/2,35,tier-14,{kind:'pillar',hp:4,section:sec,d:.0026,render:spr(A.pillar,35/70,(tier-14)/660)}),box(r,y-tier/2,35,tier-14,{kind:'pillar',hp:4,section:sec,d:.0026,render:spr(A.pillar,35/70,(tier-14)/660)}))}if(n>0){let m=box(H.x+(n%2?48:-48),y-53,52,72,{kind:'manager',hp:1.1,section:sec,f:.2,fs:.22,d:.0015,render:spr(A.manager,52/172,72/238)});parts.push(m);targets.push(m)}}});World.add(E.world,parts)}function spawn(){let base=innerHeight-cfg.floor;anchor={x:210,y:base-180};hero=Bodies.circle(anchor.x,anchor.y,cfg.r,{restitution:.34,friction:.18,frictionStatic:.15,frictionAir:.007,density:.0045,render:spr(A.idle,120/330,120/330)});hero.g={kind:'hero'};World.add(E.world,hero);S.drag=false;S.launched=false;S.can=true;S.super=false;$('super').classList.remove('show')}function reset(all=true){Composite.clear(E.world,false);floor=Bodies.rectangle(2800,innerHeight-cfg.floor/2,9500,cfg.floor,{isStatic:true,friction:1,render:{fillStyle:'#172333'}});World.add(E.world,floor);if(all){S.score=S.shots=S.broken=0}build();spawn();cam.x=cam.tx=Math.max(760,innerWidth*.45);cam.y=cam.ty=innerHeight/2;hud()}function hud(){$('score').textContent=S.score;$('shots').textContent=S.shots;$('broken').textContent=S.broken;$('targets').textContent=targets.filter(x=>!x.g.dead&&Composite.get(E.world,x.id,'body')).length}function wake(sec){if(sec<0||active.has(sec))return;active.add(sec);parts.forEach(b=>{if(b.g.section===sec&&!b.g.dead){Body.setStatic(b,false);Body.setVelocity(b,{x:0,y:0});Body.setAngularVelocity(b,0)}})}function pw(e){let r=c.getBoundingClientRect(),b=S.bounds||R.bounds,sx=(e.clientX-r.left)/r.width,sy=(e.clientY-r.top)/r.height;return{x:b.min.x+sx*(b.max.x-b.min.x),y:b.min.y+sy*(b.max.y-b.min.y)}}c.onpointerdown=e=>{if(!hero||S.launched||!S.can)return;let p=pw(e);if(Vector.magnitude(Vector.sub(p,hero.position))>cfg.r*1.5)return;S.pid=e.pointerId;S.drag=true;S.bounds={min:{...R.bounds.min},max:{...R.bounds.max}};c.setPointerCapture?.(e.pointerId);Body.setStatic(hero,true)};c.onpointermove=e=>{if(!S.drag||e.pointerId!==S.pid)return;let p=pw(e),v=Vector.sub(p,anchor),d=Math.max(1,Vector.magnitude(v));Body.setPosition(hero,Vector.add(anchor,Vector.mult(v,Math.min(1,cfg.pull/d))));Body.setVelocity(hero,{x:0,y:0})};function up(e){if(!S.drag||e.pointerId!==S.pid)return;S.drag=false;S.bounds=null;S.pid=null;Body.setStatic(hero,false);let p=Vector.sub(anchor,hero.position),d=Vector.magnitude(p);if(d<12){Body.setPosition(hero,anchor);return}Body.setVelocity(hero,Vector.mult(Vector.normalise(p),Math.min(d,cfg.pull)*cfg.power));hero.render.sprite.texture=A.fly;hero.render.sprite.xScale=hero.render.sprite.yScale=110/270;S.launched=true;S.can=false;S.shots++;S.score+=5;$('super').classList.add('show');hud();setTimeout(()=>{if(hero)World.remove(E.world,hero);spawn()},cfg.respawn)}c.onpointerup=up;c.onpointercancel=up;function speed(pair){let rv=Vector.sub(pair.bodyA.velocity,pair.bodyB.velocity),n=pair.collision?.normal||{x:0,y:1};return Math.abs(Vector.dot(rv,n))}function mass(a,b){let x=a.isStatic?Infinity:a.mass||1,y=b.isStatic?Infinity:b.mass||1;if(!isFinite(x))return y;if(!isFinite(y))return x;return x*y/(x+y)}function damage(b,en,m=1){if(!b?.g||b.g.kind==='hero'||b.g.dead)return;if(b.isStatic)wake(b.g.section);b.g.hp-=en*cfg.dmg*m;if(b.g.hp<=0)brk(b)}function brk(b){if(b.g.dead)return;b.g.dead=true;let g=b.g,p={...b.position},ang=b.angle,v={...b.velocity};World.remove(E.world,b);S.broken++;S.score+=g.kind==='manager'?80:20;if(g.kind==='manager')toast('Менеджер выбит!');if(Math.min(g.w,g.h)>20){let sx=g.w>=g.h;for(let i=0;i<2;i++){let w=sx?g.w*.47:g.w*.92,h=sx?g.h*.92:g.h*.47,lo=sx?{x:(i?1:-1)*g.w*.255,y:0}:{x:0,y:(i?1:-1)*g.h*.255},o=Vector.rotate(lo,ang),q=box(p.x+o.x,p.y+o.y,w,h,{kind:'debris',hp:.7,section:g.section,f:.45,fs:.5,d:.0015});Body.setStatic(q,false);Body.setAngle(q,ang);Body.setVelocity(q,{x:v.x+o.x*.008,y:v.y+o.y*.008});Body.setAngularVelocity(q,(i?1:-1)*.045);q.g.born=performance.now();debris.push(q);World.add(E.world,q)}}hud()}Events.on(E,'collisionStart',e=>e.pairs.forEach(pair=>{let a=pair.bodyA,b=pair.bodyB,s=speed(pair);if(s<cfg.minHit)return;let en=.5*mass(a,b)*s*s;if(a===hero){wake(b.g?.section??-1);damage(b,en,1.15)}else if(b===hero){wake(a.g?.section??-1);damage(a,en,1.15)}else{if(active.has(a.g?.section))damage(a,en,.62);if(active.has(b.g?.section))damage(b,en,.62)}if(en>9)cam.shake=Math.min(16,cam.shake+en*.35)}));$('super').onclick=()=>{if(!S.launched||S.super||!hero)return;S.super=true;$('super').classList.remove('show');toast('SUPER УДАР!');Composite.allBodies(E.world).forEach(b=>{if(b===hero||!b.g)return;let d=Vector.sub(b.position,hero.position),m=Vector.magnitude(d);if(m>245||m<1)return;wake(b.g.section);let t=1-m/245,dir=Vector.mult(d,1/m);if(b.isStatic)Body.setStatic(b,false);Body.applyForce(b,b.position,Vector.mult(dir,.025*t*(b.mass||1)));damage(b,7+13*t,1.7)});cam.shake=18};function camera(){if(hero&&S.launched){cam.tx=hero.position.x+220;cam.ty=hero.position.y-80}else{cam.tx=Math.max(760,innerWidth*.45);cam.ty=innerHeight/2}cam.x+=(cam.tx-cam.x)*.1;cam.y+=(cam.ty-cam.y)*.1;cam.shake*=.82;let sx=(Math.random()*2-1)*cam.shake,sy=(Math.random()*2-1)*cam.shake,vw=innerWidth/(S.zoom*.9),vh=innerHeight/(S.zoom*.9);R.bounds.min.x=cam.x+sx-vw/2;R.bounds.max.x=cam.x+sx+vw/2;R.bounds.min.y=cam.y+sy-vh/2;R.bounds.max.y=cam.y+sy+vh/2;Render.lookAt(R,R.bounds)}Events.on(E,'beforeUpdate',()=>{if(hero&&S.launched){let v=Vector.magnitude(hero.velocity);if(v>cfg.maxV)Body.setVelocity(hero,Vector.mult(hero.velocity,cfg.maxV/v));if(v<.2&&hero.position.y<innerHeight-cfg.floor-55)Body.setVelocity(hero,{x:.45,y:1.05})}let now=performance.now();for(let i=debris.length-1;i>=0;i--){let d=debris[i];if(!Composite.get(E.world,d.id,'body')||now-d.g.born>7500){if(Composite.get(E.world,d.id,'body'))World.remove(E.world,d);debris.splice(i,1)}}camera()});Events.on(R,'afterRender',()=>{if(!S.drag||!hero)return;let ctx=R.context,b=R.bounds,to=p=>({x:(p.x-b.min.x)/(b.max.x-b.min.x)*R.canvas.width,y:(p.y-b.min.y)/(b.max.y-b.min.y)*R.canvas.height}),pull=Vector.sub(anchor,hero.position),d=Math.min(Vector.magnitude(pull),cfg.pull);if(d<8)return;let p={...hero.position},v=Vector.mult(Vector.normalise(pull),d*cfg.power),g=E.world.gravity.y*E.world.gravity.scale*(1000/60)*(1000/60);ctx.save();for(let i=0;i<32;i++){p.x+=v.x;p.y+=v.y;v.y+=g;if(i%2===0){let z=to(p);ctx.beginPath();ctx.fillStyle=`rgba(255,225,145,${.9-i/40})`;ctx.arc(z.x,z.y,4,0,Math.PI*2);ctx.fill()}}ctx.restore()});$('reset').onclick=()=>reset(true);$('debug').onclick=()=>R.options.wireframes=!R.options.wireframes;$('plus').onclick=()=>S.zoom=Math.min(1.6,S.zoom*1.1);$('minus').onclick=()=>S.zoom=Math.max(.65,S.zoom/1.1);c.addEventListener('wheel',e=>{e.preventDefault();S.zoom=Math.max(.65,Math.min(1.6,S.zoom*(e.deltaY>0?.92:1.08)))},{passive:false});addEventListener('resize',()=>reset(false));Render.run(R);Runner.run(run,E);reset(true)})();</script></body></html>
