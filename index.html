<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Office Birds — Physics Overhaul</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .hud{position:fixed;z-index:10;left:14px;top:14px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
    .panel{pointer-events:auto;background:rgba(7,15,27,.72);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px 14px;color:#f6f8fb;backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.28)}
    .title{font-weight:900;font-size:15px;margin-bottom:5px}
    .sub{font-size:12px;line-height:1.35;opacity:.8;max-width:340px}
    .stats{display:grid;grid-template-columns:auto auto;gap:4px 16px;margin-top:9px;font-size:12px}
    .stats b{text-align:right}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}
    button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.09);color:#fff;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}
    button:hover{background:rgba(255,255,255,.15)}
    .super{position:fixed;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);display:none}
    .super.show{display:block}
    .super button{font-size:24px;padding:18px 34px;border:2px solid rgba(255,214,82,.7);background:rgba(255,196,38,.22);box-shadow:0 0 40px rgba(255,196,38,.18)}
    .menu{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(1,6,12,.76);backdrop-filter:blur(10px)}
    .menu.hide{display:none}
    .card{width:min(620px,calc(100vw - 30px));text-align:center;background:rgba(10,19,32,.88);border:1px solid rgba(255,255,255,.13);border-radius:24px;padding:30px;color:white;box-shadow:0 30px 120px rgba(0,0,0,.5)}
    .card h1{font-size:42px;margin:0 0 10px}
    .card p{opacity:.82;line-height:1.5;margin:0 auto 18px;max-width:500px}
    .start{font-size:24px;padding:16px 36px;border-color:rgba(255,214,82,.7);background:rgba(255,196,38,.2)}
    .toast{position:fixed;z-index:30;left:50%;top:16%;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.58);color:white;opacity:0;transition:.2s;pointer-events:none}
    .toast.show{opacity:1}
    @media(max-width:760px){
      .hud{left:8px;top:8px;right:8px;flex-direction:column}
      .panel{max-width:calc(100vw - 16px)}
      .card h1{font-size:32px}
      .super{bottom:14px}
      .super button{font-size:20px;padding:15px 27px}
    }
  </style>
</head>
<body>
  <div id="menu" class="menu">
    <div class="card">
      <h1>OFFICE BIRDS</h1>
      <p>Зажми героя, оттяни назад и отпусти. Разрушай офис цепными обвалами. Во время полёта используй SUPER для ударной волны.</p>
      <button id="start" class="start">НАЧАТЬ</button>
    </div>
  </div>

  <div class="hud">
    <div class="panel">
      <div class="title">Office Birds — Physics Overhaul</div>
      <div class="sub">Точный прицел • цепные разрушения • стабильные обломки • физика без случайных взрывов</div>
      <div class="stats">
        <span>Счёт</span><b id="score">0</b>
        <span>Менеджеры</span><b id="targets">0</b>
        <span>Разрушено</span><b id="broken">0</b>
        <span>Выстрелы</span><b id="shots">0</b>
      </div>
    </div>
    <div class="panel buttons">
      <button id="reset">Reset</button>
      <button id="debug">Debug</button>
      <button id="zoomOut">−</button>
      <button id="zoomIn">+</button>
    </div>
  </div>

  <div id="superWrap" class="super"><button id="superBtn">SUPER ⚡</button></div>
  <div id="toast" class="toast"></div>
  <canvas id="game"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script>
  (() => {
    "use strict";

    const {Engine, Render, Runner, World, Bodies, Body, Events, Composite, Vector} = Matter;
    const canvas = document.getElementById("game");
    const $ = id => document.getElementById(id);

    const CONFIG = {
      gravity: 1,
      floorH: 90,
      maxPull: 330,
      launchPower: 0.145,
      playerRadius: 48,
      playerMaxSpeed: 42,
      respawnMs: 7000,
      damageScale: 0.12,
      minDamageSpeed: 2.8,
      superRadius: 250,
      superImpulse: 0.028,
      debrisLife: 8000
    };

    const state = {
      started:false, dragging:false, launched:false, canLaunch:true,
      superUsed:false, debug:false, zoom:1, score:0, shots:0, broken:0,
      pointerId:null, dragBounds:null, respawnTimer:null, won:false
    };

    const engine = Engine.create({enableSleeping:true});
    engine.world.gravity.y = CONFIG.gravity;
    engine.positionIterations = 10;
    engine.velocityIterations = 8;
    engine.constraintIterations = 4;

    const render = Render.create({
      canvas, engine,
      options:{
        width:innerWidth,height:innerHeight,pixelRatio:Math.min(devicePixelRatio||1,2),
        wireframes:false,background:"#07101d",hasBounds:true
      }
    });
    const runner = Runner.create({isFixed:true,delta:1000/60});

    let floor, player;
    let breakables = [];
    let targets = [];
    let debris = [];
    let anchor = {x:210,y:420};
    let camera = {x:900,y:360,tx:900,ty:360,shake:0};

    const toast = (text,ms=1100) => {
      const el=$("toast"); el.textContent=text; el.classList.add("show");
      clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),ms);
    };

    function resize(){
      render.canvas.width=Math.floor(innerWidth*render.options.pixelRatio);
      render.canvas.height=Math.floor(innerHeight*render.options.pixelRatio);
      render.options.width=innerWidth; render.options.height=innerHeight;
      if(floor){
        Body.setPosition(floor,{x:2600,y:innerHeight-CONFIG.floorH/2});
      }
      resetLevel(false);
    }

    function makeBody(x,y,w,h,opts={}){
      const body=Bodies.rectangle(x,y,w,h,{
        restitution:opts.restitution??0.02,
        friction:opts.friction??0.85,
        frictionStatic:opts.frictionStatic??1,
        frictionAir:opts.frictionAir??0.012,
        density:opts.density??0.002,
        chamfer:{radius:Math.min(5,w/8,h/8)},
        render:{
          fillStyle:opts.color||"#9a6a42",
          strokeStyle:"rgba(255,255,255,.15)",
          lineWidth:1
        }
      });
      body.game={
        kind:opts.kind||"beam",
        hp:opts.hp??2.2,
        maxHp:opts.hp??2.2,
        w,h,
        breakLevel:opts.breakLevel||0,
        dead:false,
        born:performance.now()
      };
      return body;
    }

    function buildLevel(){
      breakables=[]; targets=[]; debris=[];
      const baseY=innerHeight-CONFIG.floorH;
      const houses=[
        {cx:Math.max(870,innerWidth*.62),levels:3},
        {cx:Math.max(1370,innerWidth*.92),levels:3},
        {cx:Math.max(1860,innerWidth*1.22),levels:4}
      ];

      for(const house of houses){
        const width=390;
        const pillarW=34;
        const tierH=125;
        const left=house.cx-width/2, right=house.cx+width/2;

        for(let level=0;level<house.levels;level++){
          const y=baseY-35-level*tierH;
          const beam=makeBody(house.cx,y,width,32,{kind:"beam",hp:2.8,color:"#a96f42",density:.0024});
          breakables.push(beam);

          if(level<house.levels-1){
            const p1=makeBody(left,y-tierH/2,pillarW,tierH-14,{kind:"pillar",hp:3.2,color:"#bd8352",density:.0026});
            const p2=makeBody(right,y-tierH/2,pillarW,tierH-14,{kind:"pillar",hp:3.2,color:"#bd8352",density:.0026});
            breakables.push(p1,p2);
          }

          if(level>0){
            const manager=makeBody(house.cx+(level%2?45:-45),y-56,58,78,{kind:"manager",hp:1.2,color:"#d9e2ee",density:.0018});
            manager.render.fillStyle="#d9e2ee";
            breakables.push(manager); targets.push(manager);
          }
        }
      }
      World.add(engine.world,breakables);
    }

    function spawnPlayer(){
      const baseY=innerHeight-CONFIG.floorH;
      anchor={x:210,y:baseY-180};
      player=Bodies.circle(anchor.x,anchor.y,CONFIG.playerRadius,{
        restitution:.25,friction:.8,frictionAir:.009,density:.005,
        render:{fillStyle:"#f0c06a",strokeStyle:"#fff2c4",lineWidth:3}
      });
      player.game={kind:"player"};
      World.add(engine.world,player);
      state.dragging=false; state.launched=false; state.canLaunch=true; state.superUsed=false;
      $("superWrap").classList.remove("show");
    }

    function resetLevel(resetStats=true){
      if(state.respawnTimer){clearTimeout(state.respawnTimer);state.respawnTimer=null}
      Composite.clear(engine.world,false);
      floor=Bodies.rectangle(2600,innerHeight-CONFIG.floorH/2,9000,CONFIG.floorH,{
        isStatic:true,friction:1,restitution:0,render:{fillStyle:"#172333"}
      });
      World.add(engine.world,floor);
      if(resetStats){
        state.score=0;state.shots=0;state.broken=0;state.won=false;
      }
      buildLevel();
      spawnPlayer();
      camera.x=camera.tx=900; camera.y=camera.ty=innerHeight/2;
      updateHud();
    }

    function updateHud(){
      $("score").textContent=state.score;
      $("shots").textContent=state.shots;
      $("broken").textContent=state.broken;
      $("targets").textContent=targets.filter(t=>!t.game.dead && Composite.get(engine.world,t.id,"body")).length;
    }

    function pointerWorld(e){
      const rect=canvas.getBoundingClientRect();
      const sx=(e.clientX-rect.left)/rect.width;
      const sy=(e.clientY-rect.top)/rect.height;
      const b=state.dragBounds||render.bounds;
      return {x:b.min.x+sx*(b.max.x-b.min.x),y:b.min.y+sy*(b.max.y-b.min.y)};
    }

    function beginDrag(e){
      if(!state.started||!player||state.launched||!state.canLaunch)return;
      const p=pointerWorld(e);
      if(Vector.magnitude(Vector.sub(p,player.position))>CONFIG.playerRadius*1.4)return;
      state.pointerId=e.pointerId;
      canvas.setPointerCapture?.(e.pointerId);
      state.dragging=true;
      state.dragBounds={min:{...render.bounds.min},max:{...render.bounds.max}};
      Body.setStatic(player,true);
    }

    function moveDrag(e){
      if(!state.dragging||e.pointerId!==state.pointerId)return;
      const p=pointerWorld(e);
      const pull=Vector.sub(p,anchor);
      const len=Math.max(1,Vector.magnitude(pull));
      const clamped=Vector.mult(pull,Math.min(1,CONFIG.maxPull/len));
      Body.setPosition(player,Vector.add(anchor,clamped));
      Body.setVelocity(player,{x:0,y:0});
      Body.setAngularVelocity(player,0);
    }

    function releaseDrag(e){
      if(!state.dragging||e.pointerId!==state.pointerId)return;
      state.dragging=false;state.dragBounds=null;state.pointerId=null;
      Body.setStatic(player,false);
      const pull=Vector.sub(anchor,player.position);
      const d=Vector.magnitude(pull);
      if(d<12){
        Body.setPosition(player,anchor);
        state.canLaunch=true;
        return;
      }
      const velocity=Vector.mult(Vector.normalise(pull),Math.min(d,CONFIG.maxPull)*CONFIG.launchPower);
      Body.setVelocity(player,velocity);
      state.launched=true;state.canLaunch=false;state.shots++;state.score+=5;
      $("superWrap").classList.add("show");
      updateHud();
      state.respawnTimer=setTimeout(respawnPlayer,CONFIG.respawnMs);
    }

    function respawnPlayer(){
      if(player)World.remove(engine.world,player);
      spawnPlayer();
    }

    function normalImpactSpeed(pair){
      const rv=Vector.sub(pair.bodyA.velocity,pair.bodyB.velocity);
      const n=pair.collision?.normal||{x:0,y:1};
      return Math.abs(Vector.dot(rv,n));
    }

    function reducedMass(a,b){
      const ma=a.isStatic?Infinity:(a.mass||1);
      const mb=b.isStatic?Infinity:(b.mass||1);
      if(!isFinite(ma))return mb;
      if(!isFinite(mb))return ma;
      return (ma*mb)/(ma+mb);
    }

    function damageBody(body,energy,source){
      if(!body?.game||body.game.kind==="player"||body.game.dead)return;
      if(body.isStatic)return;
      const multiplier=source==="player"?1.15:source==="super"?1.8:0.72;
      body.game.hp-=energy*CONFIG.damageScale*multiplier;
      if(body.game.hp<=0)breakBody(body,source);
    }

    function breakBody(body,source){
      if(!body?.game||body.game.dead)return;
      body.game.dead=true;
      const {w,h,kind,breakLevel}=body.game;
      const pos={...body.position},angle=body.angle,velocity={...body.velocity},av=body.angularVelocity||0;
      World.remove(engine.world,body);
      state.broken++;
      state.score+=kind==="manager"?80:20;
      if(kind==="manager")toast("Менеджер выбит! +80");

      if(breakLevel<1 && Math.min(w,h)>20){
        const splitX=w>=h;
        for(let i=0;i<2;i++){
          const nw=splitX?w*.47:w*.92;
          const nh=splitX?h*.92:h*.47;
          const local=splitX?{x:(i?1:-1)*w*.255,y:0}:{x:0,y:(i?1:-1)*h*.255};
          const off=Vector.rotate(local,angle);
          const piece=makeBody(pos.x+off.x,pos.y+off.y,nw,nh,{
            kind:"debris",hp:.65,breakLevel:breakLevel+1,
            color:kind==="manager"?"#c7d2df":"#805638",
            density:.0016,frictionAir:.018
          });
          Body.setAngle(piece,angle);
          Body.setVelocity(piece,{x:velocity.x+off.x*.012,y:velocity.y+off.y*.012});
          Body.setAngularVelocity(piece,av+(i?1:-1)*.06);
          debris.push(piece);
          World.add(engine.world,piece);
        }
      }

      updateHud();
      checkWin();
    }

    function processPair(pair){
      const a=pair.bodyA,b=pair.bodyB;
      const speed=normalImpactSpeed(pair);
      if(speed<CONFIG.minDamageSpeed)return;
      const energy=.5*reducedMass(a,b)*speed*speed;

      if(a===player)damageBody(b,energy,"player");
      else if(b===player)damageBody(a,energy,"player");
      else{
        damageBody(a,energy,"chain");
        damageBody(b,energy,"chain");
      }

      if(energy>8)camera.shake=Math.min(18,camera.shake+energy*.45);
    }

    function activateSuper(){
      if(!state.launched||state.superUsed||!player)return;
      state.superUsed=true;
      $("superWrap").classList.remove("show");
      toast("SUPER УДАР!");
      const r2=CONFIG.superRadius*CONFIG.superRadius;
      for(const body of Composite.allBodies(engine.world)){
        if(body===player||body.isStatic||!body.game)continue;
        const delta=Vector.sub(body.position,player.position);
        const d2=Vector.magnitudeSquared(delta);
        if(d2>r2||d2<1)continue;
        const d=Math.sqrt(d2);
        const t=1-d/CONFIG.superRadius;
        const dir=Vector.mult(delta,1/d);
        Body.applyForce(body,body.position,Vector.mult(dir,CONFIG.superImpulse*t*(body.mass||1)));
        damageBody(body,7+15*t,"super");
      }
      camera.shake=20;
    }

    function checkWin(){
      const alive=targets.some(t=>!t.game.dead&&Composite.get(engine.world,t.id,"body"));
      if(!alive&&!state.won){
        state.won=true;state.score+=300;updateHud();
        toast("ПОБЕДА! Офис разгромлен 🏆",2200);
      }
    }

    function updateCamera(){
      if(player&&state.launched){camera.tx=player.position.x+230;camera.ty=player.position.y-80}
      else{camera.tx=900;camera.ty=innerHeight/2}
      camera.x+=(camera.tx-camera.x)*.1;
      camera.y+=(camera.ty-camera.y)*.1;
      camera.shake*=.82;
      const sx=(Math.random()*2-1)*camera.shake;
      const sy=(Math.random()*2-1)*camera.shake;
      const vw=innerWidth/(state.zoom*.9),vh=innerHeight/(state.zoom*.9);
      render.bounds.min.x=camera.x+sx-vw/2;
      render.bounds.max.x=camera.x+sx+vw/2;
      render.bounds.min.y=camera.y+sy-vh/2;
      render.bounds.max.y=camera.y+sy+vh/2;
      Render.lookAt(render,render.bounds);
    }

    function drawAim(){
      if(!state.dragging||!player)return;
      const ctx=render.context;
      const b=render.bounds;
      const toScreen=p=>({x:(p.x-b.min.x)/(b.max.x-b.min.x)*render.canvas.width,y:(p.y-b.min.y)/(b.max.y-b.min.y)*render.canvas.height});
      const pull=Vector.sub(anchor,player.position);
      const d=Math.min(Vector.magnitude(pull),CONFIG.maxPull);
      if(d<8)return;
      const v0=Vector.mult(Vector.normalise(pull),d*CONFIG.launchPower);
      let p={...player.position},v={...v0};
      const gravityPerTick=engine.world.gravity.y*engine.world.gravity.scale*(1000/60)*(1000/60);
      ctx.save();
      for(let i=0;i<32;i++){
        p.x+=v.x;
        p.y+=v.y;
        v.y+=gravityPerTick;
        if(i%2===0){
          const s=toScreen(p);
          ctx.beginPath();
          ctx.fillStyle=`rgba(255,225,145,${.9-i/40})`;
          ctx.arc(s.x,s.y,4,0,Math.PI*2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    Events.on(engine,"collisionStart",e=>e.pairs.forEach(processPair));
    Events.on(engine,"beforeUpdate",()=>{
      if(player&&state.launched){
        const speed=Vector.magnitude(player.velocity);
        if(speed>CONFIG.playerMaxSpeed)Body.setVelocity(player,Vector.mult(player.velocity,CONFIG.playerMaxSpeed/speed));
        if(player.position.y>innerHeight+900||player.position.x>5200||player.position.x<-800){
          clearTimeout(state.respawnTimer);respawnPlayer();
        }
      }
      const now=performance.now();
      for(let i=debris.length-1;i>=0;i--){
        const d=debris[i];
        if(!Composite.get(engine.world,d.id,"body")){debris.splice(i,1);continue}
        if(now-d.game.born>CONFIG.debrisLife||d.position.y>innerHeight+1000){
          World.remove(engine.world,d);debris.splice(i,1);
        }
      }
      updateCamera();
    });
    Events.on(render,"afterRender",drawAim);

    canvas.addEventListener("pointerdown",beginDrag);
    canvas.addEventListener("pointermove",moveDrag);
    canvas.addEventListener("pointerup",releaseDrag);
    canvas.addEventListener("pointercancel",releaseDrag);
    canvas.addEventListener("wheel",e=>{
      e.preventDefault();
      state.zoom=Math.max(.6,Math.min(1.65,state.zoom*(e.deltaY>0?.92:1.08)));
    },{passive:false});

    $("start").onclick=()=>{state.started=true;$("menu").classList.add("hide");runner.enabled=true};
    $("reset").onclick=()=>resetLevel(true);
    $("debug").onclick=()=>{state.debug=!state.debug;render.options.wireframes=state.debug;toast(state.debug?"DEBUG ON":"DEBUG OFF")};
    $("zoomIn").onclick=()=>state.zoom=Math.min(1.65,state.zoom*1.1);
    $("zoomOut").onclick=()=>state.zoom=Math.max(.6,state.zoom/1.1);
    $("superBtn").onclick=activateSuper;
    addEventListener("resize",resize);
    addEventListener("keydown",e=>{
      if(e.key==="r"||e.key==="R")resetLevel(true);
      if(e.key===" "&&state.launched)activateSuper();
    });

    Render.run(render);
    Runner.run(runner,engine);
    runner.enabled=false;
    resetLevel(true);
  })();
  </script>
</body>
</html>
